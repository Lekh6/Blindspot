# shared_volume — true positive: orders ↔ reports share named volume
# Messy: comments, irregular spacing, trailing comment, interpolation

services:
  orders: # writer service
    image: orders:latest
    environment:
      # interpolation demo — not needed for volume but proves parser handles it alongside volumes
      DATA_PATH: ${DATA_PATH:-/data}
    # volumes with comment
    volumes:
      - shared-data:/data  # named volume shared — coupling point

  reports: # reader service
    image: reports:latest
    environment:
      DATA_PATH: ${DATA_PATH}  # resolves via .env to /data
    volumes:
      - shared-data:/data  # same named volume — real hidden coupling

volumes:
  shared-data: # named volume definition — comment
    driver: local
